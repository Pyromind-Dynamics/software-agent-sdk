[project]
name = "pyromind-common"
version = "1.29.3"
description = "Shared Pyromind business tools and execution contracts"
requires-python = ">=3.12"
dependencies = [
    "pyromind-runtime",
    "rich>=14.3.3",
    "websockets>=12",
    "cryptography>=44",
    "deprecation>=2.1.0",
    "filelock>=3.20.1",
    "httpx[socks]>=0.27.0",
    "litellm>=1.97.0",
    "pillow>=12.1.1",
    "pydantic>=2.12.5",
    "python-json-logger>=3.3.0",
    "tenacity>=9.1.2",
    "tree-sitter>=0.25",
    "tree-sitter-bash>=0.25",
    "binaryornot>=0.4.4",
    "cachetools",
    "libtmux>=0.53.0",
    "PyJWT>=2",
    "func-timeout>=4.3.5",
    "openpyxl>=3.1",
    "py-landlock>=0.1.1; sys_platform == 'linux'",
    "pyromind-sdk>=0.1.9; python_full_version < '3.14'",
    "python-socks>=1.0.0",
    "huggingface_hub>=0.25",
    "pyarrow>=17.0",
    "wandb>=0.23.1"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pyromind_common*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["py.typed", "*.j2", "*.profile"]
