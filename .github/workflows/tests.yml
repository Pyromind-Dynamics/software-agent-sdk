---
name: Run tests
on:
    push:
        branches: [main]
    pull_request:
        branches: ['**']
jobs:
    product-tests:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v6
            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
            - run: uv sync --frozen --group dev
            - run: npm ci --prefix harness-adapter/pi-runtime
            - run: npm run build --prefix harness-adapter/pi-runtime
            - run: uv run pytest tests
            - run: npm test --prefix harness-adapter/pi-runtime
