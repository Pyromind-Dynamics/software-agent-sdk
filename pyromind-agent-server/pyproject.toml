[project]
name = "pyromind-agent-server"
version = "0.1.0"
description = "Pyromind HTTP, authentication, and composition layer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104",
    "harness-adapter[openhands]",
    "openhands-agent-server",
    "pyromind-runtime[database]",
    "sqlalchemy>=2,<3",
    "pymysql>=1.1,<2",
    "alembic>=1.13,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.39.1,<2",
    "opentelemetry-sdk>=1.39.1,<2",
]

[project.scripts]
pyromind-agent-server = "pyromind_agent_server.__main__:main"
pyromind-lineage = "pyromind_agent_server.lineage:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
include = ["pyromind_agent_server*"]
namespaces = true
