---
apiVersion: v1
kind: Secret
metadata:
    name: software-agent-sdk-secret
    namespace: webapp-pre
type: Opaque
data:
    SESSION_API_KEY: NjkyNzY1OGM1YTdhOGNhNmJhM2UwMmZiYzNmOWFmYzk3MDEyYTg1Y2VhMDlkZDg3MGZmYjc3NmE2NjNlOWUwYwo=
    OH_SECRET_KEY: MjdmZmE0Y2I5ODQzNjE2ZjE0Yjc3ZmVkOGQ0YWI3MDBlMTQ4NDZmOGRkNzZjNGU0YmViOWU3YzNmMjk5ZTc3Mgo=
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    labels:
        app: software-agent-sdk
        enable-sts-monitor: 'true'
    name: software-agent-sdk
    namespace: webapp-pre
spec:
    replicas: 1
    revisionHistoryLimit: 10
    selector:
        matchLabels:
            app: software-agent-sdk
    serviceName: software-agent-sdk
    template:
        metadata:
            annotations:
                container.apparmor.security.beta.kubernetes.io/main: unconfined
            labels:
                app: software-agent-sdk
                enable-sts-monitor: 'true'
        spec:
            containers:
                - env:
                      - name: workspace_dir
                        value: /workspace
                      - name: PYROMIND_HARNESS_BACKEND
                        value: pi
                      - name: APP_ENV
                        value: pre
                      - name: PYROMIND_PI_TERMINAL_BACKEND
                        value: os-sandbox
                      # Every live conversation holds one Node runner (~270MB
                      # RSS), so the process count has to stay inside the 8Gi
                      # limit. Runners are released five minutes after a run
                      # finishes, and the ceiling bounds the worst case.
                      - name: PYROMIND_CONVERSATION_RELEASE_GRACE_SECONDS
                        value: '300'
                      - name: PYROMIND_MAX_ACTIVE_CONVERSATIONS
                        value: '20'
                      # Runtime mode and LLM configuration, mirroring what the
                      # pre cluster currently runs with.
                      - name: RunMode
                        value: agent-server
                      - name: POD_NAME
                        valueFrom:
                            fieldRef:
                                apiVersion: v1
                                fieldPath: metadata.name
                      - name: LLM_CONFIG_PATH
                        value: /etc/llm-config/llm_config.json
                      - name: LLM_MODEL
                        value: deepseek/deepseek-v4-flash-0731
                      - name: LLM_BASE_URL
                        value: https://openrouter.ai/api/v1
                      - name: OPENROUTER_API_KEY
                        valueFrom:
                            secretKeyRef:
                                key: OPENROUTER_API_KEY
                                name: software-agent-sdk-secret
                      - name: DEEPSEEK_API_KEY
                        valueFrom:
                            secretKeyRef:
                                key: DEEPSEEK_API_KEY
                                name: software-agent-sdk-secret
                      # Label Studio integration. BASE_URL is the LS REST API the
                      # server calls; PORTAL_BASE_URL is the browser-facing half
                      # that owns the SSO entry point and signs media URLs. The
                      # portal issues per-caller tokens, so no API token is
                      # configured here. Both fall back to production defaults
                      # when unset, so they must be pinned per environment.
                      - name: LABEL_STUDIO_BASE_URL
                        value: https://pre-label-studio.pyromind.ai
                      - name: LABEL_STUDIO_PORTAL_BASE_URL
                        value: https://pre-api-portal.pyromind.ai
                      - name: OH_CONVERSATION_STORAGE_QUOTA
                        value: 500M
                      - name: OH_STORAGE_QUOTA_REQUIRED
                        value: '1'
                      - name: OH_STORAGE_QUOTA_DEVICE
                        value: /dev/nvme1n1
                      - name: OH_SANDBOX_MEMORY_LIMIT
                        value: 500M
                      - name: OH_SANDBOX_MEMORY_REQUIRED
                        value: '0'
                      - name: SESSION_API_KEY
                        valueFrom:
                            secretKeyRef:
                                key: SESSION_API_KEY
                                name: software-agent-sdk-secret
                      - name: OH_SECRET_KEY
                        valueFrom:
                            secretKeyRef:
                                key: OH_SECRET_KEY
                                name: software-agent-sdk-secret
                  image: pyrominddynamics/software-agent-sdk:feat-dockerfile-a34541ee-07020635
                  imagePullPolicy: IfNotPresent
                  name: main
                  ports:
                      - containerPort: 8000
                        name: http
                        protocol: TCP
                  resources:
                      requests:
                          memory: 2Gi
                          cpu: 1
                      limits:
                          memory: 8Gi
                          cpu: 4
                  terminationMessagePath: /dev/termination-log
                  terminationMessagePolicy: File
                  volumeMounts:
                      - mountPath: /workspace
                        name: workspace
                      - mountPath: /dev/nvme1n1
                        name: workspace-device
                  securityContext:
                      capabilities:
                          add:
                              - SYS_ADMIN
                              - NET_ADMIN
                      seccompProfile:
                          type: Unconfined
            initContainers:
                - name: setup-workspace
                  image: busybox:latest
                  command:
                      - /bin/sh
                      - -c
                      - |
                        mkdir -p /workspace/conversations
                        mkdir -p /workspace/project
                        mkdir -p /workspace/bash_events
                        chown -R 10001:10001 /workspace
                        echo "Workspace initialized successfully"
                  volumeMounts:
                      - mountPath: /workspace
                        name: workspace
            securityContext:
                fsGroup: 10001
                runAsUser: 0
                runAsGroup: 0
            dnsPolicy: ClusterFirst
            imagePullSecrets:
                - name: niqi-dev-secret
            restartPolicy: Always
            volumes:
                # Host device backing the workspace quota volume; use a stable
                # by-id path (e.g. /dev/disk/by-id/nvme-Amazon_Elastic_Block_Store_vol-xxx)
                - name: workspace-device
                  hostPath:
                      path: /dev/nvme1n1
                      type: BlockDevice
    volumeClaimTemplates:
        # Enforcing the per-conversation storage quota requires the workspace
        # volume to be mounted with prjquota (XFS). Provision it through a
        # StorageClass with fsType: xfs and mountOptions: [prjquota].
        - metadata:
              name: workspace
          spec:
              accessModes:
                  - ReadWriteOnce
              resources:
                  requests:
                      storage: 100Gi
              storageClassName: gp2
---
apiVersion: v1
kind: Service
metadata:
    name: software-agent-sdk
    namespace: webapp-pre
    labels:
        app: software-agent-sdk
spec:
    selector:
        app: software-agent-sdk
    ports:
        - name: http
          port: 80
          targetPort: 8000
          protocol: TCP
    type: ClusterIP
