---
# 会话/密钥模板：**只用来占位说明，不要把真实密钥提交到 Git**。
# 真实值放 Kubernetes Secret（或用外部密钥管理）：
#   kubectl -n <ns> patch secret software-agent-sdk-secret --type merge \
#     -p '{"stringData":{"DEEPSEEK_API_KEY":"..."}}'
# 每个文件键的作用见 deploy/README.md。
apiVersion: v1
kind: Secret
metadata:
    name: software-agent-sdk-secret
type: Opaque
stringData:
    DEEPSEEK_API_KEY: <本地网关208.64.254.187:8000的key>
    OPENROUTER_API_KEY: <openrouter sk-or-v1-...>
    OPENAI_API_KEY: <legacy fallback 用，值可与 OPENROUTER_API_KEY 相同>
    DF_API_KEY: <DF/portal key>
    SESSION_API_KEY: <agent-server 会话鉴权 key>
    OH_SECRET_KEY: <openssl rand -hex 32>
