---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    labels:
        app: software-agent-sdk
        enable-sts-monitor: 'true'
    name: software-agent-sdk
    namespace: webapp-pre2
spec:
    persistentVolumeClaimRetentionPolicy:
        whenDeleted: Retain
        whenScaled: Retain
    podManagementPolicy: OrderedReady
    replicas: 1
    revisionHistoryLimit: 10
    selector:
        matchLabels:
            app: software-agent-sdk
    serviceName: software-agent-sdk
    template:
        metadata:
            annotations:
                container.apparmor.security.beta.kubernetes.io/main: unconfined
            labels:
                app: software-agent-sdk
                enable-sts-monitor: 'true'
        spec:
            containers:
                - name: main
          # Rebuilt from the current repo: ships xfsprogs + storage_quota.py.
                  image: pyrominddynamics/software-agent-sdk:feature_pyromind-agent-main-02c829a3-07210624
          # Fallback for CSI/drivers that do not propagate StorageClass
          # mountOptions: enable project quota accounting before the server
          # starts, then run the image entrypoint.
                  command:
                      - /bin/sh
                      - -c
                      - |
                        mount -o remount,prjquota /workspace || true
                        exec /agent-server/.venv/bin/python -m openhands.agent_server
                  env:
                      - name: RunMode
                        value: agent-server
                      - name: POD_NAME
                        valueFrom:
                            fieldRef:
                                fieldPath: metadata.name
                      - name: APP_ENV
                        value: pre2
                      - name: OH_CONVERSATION_STORAGE_QUOTA
                        value: 500M
                      - name: LLM_MODEL
                        value: deepseek/deepseek-v4-flash-0731
                      - name: LLM_BASE_URL
                        value: https://openrouter.ai/api/v1
                      - name: SESSION_API_KEY
                        valueFrom:
                            secretKeyRef:
                                key: SESSION_API_KEY
                                name: software-agent-sdk-secret
                      - name: OH_SECRET_KEY
                        valueFrom:
                            secretKeyRef:
                                key: OH_SECRET_KEY
                                name: software-agent-sdk-secret
                      - name: OPENAI_API_KEY
                        valueFrom:
                            secretKeyRef:
                                key: OPENAI_API_KEY
                                name: software-agent-sdk-secret
                      - name: DF_API_KEY
                        valueFrom:
                            secretKeyRef:
                                key: DF_API_KEY
                                name: software-agent-sdk-secret
                  ports:
                      - containerPort: 8000
                        name: http
                  resources:
                      limits:
                          cpu: 1
                          memory: 2Gi
                      requests:
                          cpu: 500m
                          memory: 1Gi
                  securityContext:
                      appArmorProfile:
                          type: Unconfined
                      capabilities:
                          add:
                              - SYS_ADMIN
                      seccompProfile:
                          type: Unconfined
                  volumeMounts:
                      - mountPath: /workspace
                        name: workspace
                      - mountPath: /etc/secrets
                        name: full-web-key-secret
                        readOnly: true
                      - mountPath: /etc/myhttps-ca/us-west-2/
                        name: us-west-2-ca-volume
                        readOnly: true
                      - mountPath: /etc/myhttps-ca/us-west-1/
                        name: us-west-1-ca-volume
                        readOnly: true
            initContainers:
                - name: setup-workspace
                  image: busybox:latest
                  command:
                      - /bin/sh
                      - -c
                      - |
                        mkdir -p /workspace/conversations
                        mkdir -p /workspace/project
                        chown -R 10001:10001 /workspace
                        echo "Workspace initialized successfully"
                  volumeMounts:
                      - mountPath: /workspace
                        name: workspace
            securityContext:
                fsGroup: 10001
                runAsGroup: 0
                runAsUser: 0
            dnsPolicy: ClusterFirst
            imagePullSecrets:
                - name: niqi-dev-secret
            restartPolicy: Always
    volumeClaimTemplates:
        - metadata:
              name: workspace
          spec:
              accessModes:
                  - ReadWriteOnce
              resources:
                  requests:
                      storage: 100Gi
              storageClassName: gp2-xfs
